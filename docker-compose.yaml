services:
  db:
    image: postgres:18.4-alpine3.23
    container_name: pg_database
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: migrate/migrate:latest
    container_name: migration_runner
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/database/migrations:/migrations
    command: >
      -path=/migrations
      -database=${DATABASE_URL}
      up
    restart: on-failure

  seeder:
    image: postgres:18.4-alpine3.23
    container_name: seed_runner
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/database/config_seed.sql:/seeds/config_seed.sql
      - ./backend/database/dummy_users_seed.sql:/seeds/dummy_users_seed.sql
    command: >
      sh -c "
        psql -d ${DATABASE_URL} -f /seeds/config_seed.sql &&
        psql -d ${DATABASE_URL} -f /seeds/dummy_users_seed.sql
      "
    restart: on-failure

volumes: 
  postgres_data:
