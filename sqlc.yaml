version: "2"
sql:
  - engine: "postgresql"
    queries: "./database/queries/"
    schema: "./database/migrations/"
    gen:
      go:
        package: "db"
        out: "./internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
        - db_type: "uuid"
          nullable: false
          go_type:
            import: "github.com/google/uuid"
            type: "UUID"
        - db_type: "timestamptz"
          nullable: true
          go_type: "time.Time"
        - db_type: "numeric"
          nullable: false
          go_type: "float64"
        - db_type: "text"
          nullable: false
          go_type: "string"